# Base Arch Linux image for Kapsule containers.
# Other images (e.g. kapsule-dev) inherit this via Dependencies=/BaseTrees=.

[Output]
Format=directory

[Content]
Packages=
        base
        diffutils
        # Workaround for containerd >= 2.3 (Arch package): the EROFS
        # differ hard-fails without mkfs.erofs, which cascades through
        # transfer.v1 and breaks nested Docker. Drop once containerd
        # ships a fix and Arch picks it up.
        # Upstream:  https://github.com/containerd/containerd/issues/13346
        # Tracking:  https://invent.kde.org/kde-linux/kapsule/-/work_items/24
        erofs-utils
        file
        gettext
        grep
        grml-zsh-config
        groff
        gzip
        inetutils
        iproute2
        iputils
        iptables-nft
        less
        licenses
        logrotate
        man-db
        man-pages
        nano
        procps-ng
        psmisc
        sed
        sudo
        sysfsutils
        systemd-sysvcompat
        tar
        texinfo
        vi
        which
