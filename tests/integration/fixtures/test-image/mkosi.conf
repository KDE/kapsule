# Minimal mkosi config used only by the image-refresh integration test.
#
# This produces a stripped-down Arch rootfs with just enough to satisfy
# incus' image format validation. It is NEVER booted (the test only
# pulls and refreshes the image, never creates a container from it),
# so the package set is the absolute minimum that mkosi accepts.
#
# This config is deliberately *not* under images/mkosi.images/ so that
# production builds (build-image.sh + .gitlab-ci.yml) cannot
# accidentally pick it up and publish a test fixture image.

[Distribution]
Distribution=arch
Mirror=https://geo.mirror.pkgbuild.com

[Output]
Format=directory
OutputDirectory=mkosi.output

[Build]
WithNetwork=yes

[Content]
Packages=
        bash
        coreutils
